apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: distributed-storage
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: REPLACE_WITH_AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/storage-gateway:section8
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: METADATA_URL, value: "http://metadata:9000"}
            - {name: ELASTICSEARCH_URL, valueFrom: {configMapKeyRef: {name: storage-config, key: ELASTICSEARCH_URL}}}
            - {name: API_KEYS, valueFrom: {secretKeyRef: {name: storage-secrets, key: API_KEYS}}}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: distributed-storage
spec:
  type: LoadBalancer
  selector: {app: gateway}
  ports: [{name: http, port: 80, targetPort: http}]

