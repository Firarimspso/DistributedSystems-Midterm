apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata
  namespace: distributed-storage
spec:
  replicas: 2
  selector:
    matchLabels: {app: metadata}
  template:
    metadata:
      labels: {app: metadata}
    spec:
      containers:
        - name: metadata
          image: REPLACE_WITH_AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/storage-metadata:section8
          ports: [{name: http, containerPort: 9000}]
          env:
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: storage-secrets, key: DATABASE_URL}}}
            - {name: STORAGE_NODES, valueFrom: {configMapKeyRef: {name: storage-config, key: STORAGE_NODES}}}
            - {name: REPAIR_INTERVAL_SECONDS, value: "0"}
            - {name: SCRUB_INTERVAL_SECONDS, value: "0"}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: metadata
  namespace: distributed-storage
spec:
  selector: {app: metadata}
  ports: [{name: http, port: 9000, targetPort: http}]

