apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-nginx
  namespace: distributed-storage
data:
  default.conf: |
    server {
      listen 80;
      location = / { return 302 /ui/; }
      location /ui/ { root /usr/share/nginx/html; try_files $uri $uri/ /ui/index.html; }
      location ~ ^/(buckets|cluster|search) { proxy_pass http://gateway; proxy_request_buffering off; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-ui
  namespace: distributed-storage
spec:
  replicas: 2
  selector:
    matchLabels: {app: storage-ui}
  template:
    metadata:
      labels: {app: storage-ui}
    spec:
      containers:
        - name: ui
          image: REPLACE_WITH_AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/storage-ui:section8
          ports: [{name: http, containerPort: 80}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /ui/, port: http}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /ui/, port: http}
            initialDelaySeconds: 10
          volumeMounts:
            - {name: nginx-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
      volumes:
        - name: nginx-config
          configMap: {name: ui-nginx}
---
apiVersion: v1
kind: Service
metadata:
  name: storage-ui
  namespace: distributed-storage
spec:
  type: LoadBalancer
  selector: {app: storage-ui}
  ports: [{name: http, port: 80, targetPort: http}]
